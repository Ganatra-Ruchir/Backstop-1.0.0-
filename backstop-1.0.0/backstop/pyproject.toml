[project]
name = "backstop"
version = "1.0.0"
description = "Card-fraud decisioning: scores a transaction, decides, and says why"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ruchir Ganatra" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: needs the real dataset or a trained model; skipped on a fresh clone",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["E402"]
# Typographic dashes are intentional in figure labels.
"scripts/make_figures.py" = ["E402", "RUF001"]
